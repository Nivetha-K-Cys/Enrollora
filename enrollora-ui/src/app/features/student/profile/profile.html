
<div class="profile-container">

  <h2>My Profile</h2>
  <p>View and manage your personal details</p>

  <div *ngIf="isLoading">Loading profile...</div>

  <div *ngIf="message" class="success">
    {{ message }}
  </div>

  <div *ngIf="error" class="error">
    {{ error }}
  </div>

  <div class="profile-card" *ngIf="profile && !isLoading">

    <form (ngSubmit)="saveProfile()">

      <label>Full Name</label>
      <input
        type="text"
        name="name"
        [(ngModel)]="form.name"
        [disabled]="!isEditing"
        required
      />

      <label>Email</label>
      <input
        type="email"
        [value]="profile.email"
        disabled
      />

      <label>Department</label>
      <input
        type="text"
        name="department"
        [(ngModel)]="form.department"
        [disabled]="!isEditing"
        required
      />

      <label>Age</label>
      <input
        type="number"
        name="age"
        [(ngModel)]="form.age"
        [disabled]="!isEditing"
        min="1"
        required
      />

      <label>CGPA</label>
      <input
        type="number"
        name="cgpa"
        [(ngModel)]="form.cgpa"
        [disabled]="!isEditing"
        min="0"
        max="10"
        step="0.01"
        required
      />

      <div class="actions">

        <button
          type="button"
          *ngIf="!isEditing"
          (click)="editProfile()">
          Edit Profile
        </button>

        <ng-container *ngIf="isEditing">

          <button type="submit" [disabled]="isSaving">
            {{ isSaving ? 'Saving...' : 'Save Changes' }}
          </button>

          <button type="button" (click)="cancelEdit()">
            Cancel
          </button>

        </ng-container>

      </div>

    </form>

  </div>

</div>
